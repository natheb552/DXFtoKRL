name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: DXFtoKRL-windows.exe
          - os: ubuntu-24.04
            asset: DXFtoKRL-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt-Bibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Abhängigkeiten
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --name DXFtoKRL main.py
      - name: Paket (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/DXFtoKRL.exe "${{ matrix.asset }}"
      - name: Paket (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir pkg && cp dist/DXFtoKRL README.md examples/beispiel.dxf pkg/
          tar -czf "${{ matrix.asset }}" -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp examples/beispiel.dxf assets/
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "DXFtoKRL $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
